# Configure this model to be materialized as a view
# in development and a table in production/CI contexts
version: 2
models:

  - name: bronze_date
    config:
      materialized: view
      schema: bronze

  - name: bronze_customer
    config:
        materialized: view

#for dbt test
  - name: bronze_sales
    columns:
      - name: sales_id
        data_tests:
          - unique
          - not_null
      - name: gross_amount
        data_tests:
          - generic_nonnegative #custom generic test

  - name: bronze_store
    columns:
      - name: store_sk
        data_tests:
          - unique
          - not_null

      - name: store_name
        data_tests:
          - accepted_values:
              arguments: # available in v1.10.5 and higher. Older versions can set the <argument_name> as the top-level property.
                values: ['MegaMart Manhattan','MegaMart Brooklyn','MegaMart Austin','MegaMart San Jose','MegaMart Toronto']
          
      - name: country
        data_tests:
        - accepted_values:
            arguments:
              values: ['USA','canada'] #Canada that's why give error and add saverity
            severity: warn

  

  